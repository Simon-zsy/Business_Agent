# Business Agent Configuration File

# Data sources configuration
sources:
  - id: "us_market"
    region_name: "US Market"
    lang: "en"
    country: "us"
    keywords: "stock market earnings economy nasdaq"

# API configuration
api:
  max_results: 30  # Maximum results per search query
  request_delay: 2  # Request interval (seconds)

# Display configuration
display:
  max_per_region: 10  # Maximum articles to display per region (0=unlimited)
  show_source_count: true  # Show multi-source report count
  similarity_threshold: 0.6  # News similarity threshold (for deduplication)
